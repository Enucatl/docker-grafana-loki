services:

  loki:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-large
    image: grafana/loki:latest
    cpu_shares: 128
    volumes:
      - ./loki:/etc/loki
      - loki_data:/var/lib/loki
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - 3100
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - loki_proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.loki-push.rule=Host(`loki.${DOCKER_DOMAIN}`) && Method(`POST`) && Path(`/loki/api/v1/push`)'
      - 'traefik.http.routers.loki-push.entrypoints=https'
      - 'traefik.http.routers.loki-push.tls=true'
      - 'traefik.http.routers.loki-push.service=loki'
      - 'traefik.http.routers.loki-read.rule=Host(`loki-read.${DOCKER_DOMAIN}`) && Method(`GET`) && (Path(`/loki/api/v1/query`) || Path(`/loki/api/v1/query_range`) || Path(`/loki/api/v1/labels`) || Path(`/loki/api/v1/series`) || PathRegexp(`^/loki/api/v1/label/[^/]+/values$`))'
      - 'traefik.http.routers.loki-read.entrypoints=https'
      - 'traefik.http.routers.loki-read.tls=true'
      - 'traefik.http.routers.loki-read.tls.options=mtls@file'
      - 'traefik.http.routers.loki-read.service=loki'
      - "traefik.http.services.loki.loadbalancer.server.port=3100"

  grafana:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-medium
    image: grafana/grafana:latest
    cpu_shares: 128
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/roles.yml:/etc/grafana/provisioning/access-control/roles.yml
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./grafana/dashboards/provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ../crabberbot/grafana-dashboard.json:/var/lib/grafana/dashboards/crabberbot.json:ro
      - ../barbero-scripts/grafana-dashboard.json:/var/lib/grafana/dashboards/barbero.json:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    environment:
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE=/run/secrets/oidc_client_secret
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - traefik_proxy
      - crabberbot_backend
      - loki_proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_proxy'
      - 'traefik.http.routers.grafana.rule=Host(`grafana.${DOCKER_DOMAIN}`)'
      - 'traefik.http.routers.grafana.entrypoints=https'
      - 'traefik.http.routers.grafana.tls=true'
      - "traefik.http.routers.grafana.middlewares=secured@file"
      - "traefik.http.routers.grafana.service=grafana"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    secrets:
      - oidc_client_secret


volumes:
  grafana_data:
  loki_data:

networks:
  traefik_proxy:
    external: true
  loki_proxy:
    external: true
  crabberbot_backend:
    external: true

secrets:
  oidc_client_secret:
    file: secrets/oidc_client_secret
