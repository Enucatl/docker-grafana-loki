auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Keep request buffers bounded for this low-volume deployment.
  grpc_server_max_recv_msg_size: 16777216  # 16MB
  grpc_server_max_send_msg_size: 16777216  # 16MB

common:
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2025-12-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Compactor is required for TSDB and for cleaning up old logs (Retention)
compactor:
  working_directory: /var/lib/loki/compactor
  delete_request_store: filesystem
  delete_request_cancel_period: 0s
  compaction_interval: 60m
  retention_enabled: true
  retention_delete_delay: 48h
  retention_delete_worker_count: 4

query_range:
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32

ruler:
  alertmanager_url: http://localhost:9093

limits_config:
  deletion_mode: filter-and-delete

  #retention_period: 720h  # 1 month
  retention_period: 1440h  # 2 months

  # --- INGESTION LIMITS ---
  # Low-volume deployment limits.
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
  ingestion_burst_size_mb: 8
  ingestion_rate_mb: 4
  
  # --- QUERY LIMITS ---
  max_entries_limit_per_query: 1000000
  max_query_length: 33d
  max_query_parallelism: 32
  tsdb_max_query_parallelism: 32
  query_timeout: 1m
  
  # --- LABEL LIMITS ---
  cardinality_limit: 200000
  max_label_names_per_series: 300
  
  # Avoid putting log content in Labels. 
  # If you need to attach metadata that isn't for searching/indexing,
  # use 'structured_metadata' instead of huge labels.
  max_label_value_length: 20480 
  max_label_name_length: 1024
  
  # Enable Structured Metadata (Loki 3.0+)
  # This allows you to attach data to logs without bloating the index.
  allow_structured_metadata: true

analytics:
  reporting_enabled: false
